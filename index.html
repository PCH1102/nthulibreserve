<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>清大圖書館座位</title>
<meta name="theme-color" content="#5b1a78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="圖書館座位">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f3f8; --card:#fff; --ink:#1d1524; --mute:#6f6578; --line:#e7e0ec;
  --brand:#5b1a78; --brand-ink:#fff; --ok:#1f9d6b; --warn:#d98a14; --full:#d0453c; --track:#ece6f0;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141018; --card:#1f1926; --ink:#f1ecf5; --mute:#a497b0; --line:#2f2738;
    --brand:#b684d6; --brand-ink:#1a1020; --track:#2c2436; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
  max-width:520px; margin:0 auto; min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit}
header{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:16px; gap:12px}
h1{font-size:22px; margin:0; letter-spacing:.02em}
.sub{font-size:13px; color:var(--mute); margin-top:4px}
.hdr-btns{display:flex; gap:8px; align-items:center}
.pill{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:999px; height:40px; padding:0 14px; font-size:14px;
}
.pill:active{transform:scale(.97)}
.pill[disabled]{opacity:.5}
#bell{position:relative; width:40px; padding:0; display:grid; place-items:center}
#bell svg{width:20px; height:20px}
.badge{position:absolute; top:-5px; right:-5px; min-width:19px; height:19px; padding:0 5px; border-radius:10px;
  background:var(--full); color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center}
.badge[hidden]{display:none}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin-bottom:12px}
.row{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.name{font-size:15px; color:var(--mute)}
.num{font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1}
.num small{font-size:15px; font-weight:500; color:var(--mute)}
.bar{height:8px; border-radius:99px; background:var(--track); margin-top:12px; overflow:hidden}
.bar i{display:block; height:100%; width:0; border-radius:99px; background:var(--ok); transition:width .5s ease}
.note{font-size:13px; color:var(--mute); margin-top:6px; line-height:1.5}
.tag{font-size:12px; padding:3px 9px; border-radius:99px; background:var(--track); color:var(--mute); white-space:nowrap}
.tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.full{color:var(--full)}
.err{color:var(--full)}
h2{font-size:15px; color:var(--mute); font-weight:600; margin:20px 4px 8px}
#spaces{padding:6px 18px}
.sp{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); font-size:16px}
.sp:last-child{border-bottom:0}
.sp b{font-size:20px; font-variant-numeric:tabular-nums}
.sp.zero{color:var(--mute)} .sp.zero b{font-weight:500}
.actions{margin-top:20px; display:grid; gap:10px}
.btn{
  display:flex; align-items:center; justify-content:center; text-decoration:none; border:0;
  min-height:54px; border-radius:16px; font-size:17px; font-weight:600; cursor:pointer;
}
.btn.primary{background:var(--brand); color:var(--brand-ink)}
.btn.ghost{border:1px solid var(--line); color:var(--ink); background:var(--card); font-weight:500; font-size:15px; min-height:48px}
.btn.small{min-height:40px; padding:0 14px; font-size:14px; white-space:nowrap; border-radius:12px}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.5}

/* 首頁的「下一則通知」卡片 */
#next-card{display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer; width:100%; text-align:left; font:inherit; color:inherit}
#next-card b{font-size:15px}
#next-card .go{color:var(--mute); font-size:20px}

/* 通知總覽（全螢幕） */
dialog{border:0; padding:0; color:var(--ink); background:var(--bg)}
dialog::backdrop{background:rgba(0,0,0,.45)}
#panel{width:100%; max-width:520px; height:100%; max-height:none; margin:0 auto}
.sheet{padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.sheet-head h2{margin:0; font-size:20px; color:var(--ink)}
.split{display:flex; align-items:center; justify-content:space-between; gap:12px}
.split b{font-size:15px}
#push-box.on #push-state{color:var(--ok)}
.nt{padding:14px 0; border-bottom:1px solid var(--line)}
.nt:last-child{border-bottom:0}
.nt .t{font-size:16px; font-weight:600}
.nt .d{font-size:14px; color:var(--mute); margin-top:2px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.chip{font-size:12px; padding:3px 9px; border-radius:99px; background:var(--track); color:var(--ink)}
.chip.off{color:var(--mute)}
.chip.done{color:var(--mute); text-decoration:line-through}
.nt-btns{display:flex; gap:8px; margin-top:10px}
.nt-btns button{flex:1}
.link-danger{background:none; border:1px solid var(--line); color:var(--full); border-radius:12px; min-height:40px; font-size:14px}
#list:empty::after{content:'目前沒有預約通知。預約成功後收到圖書館的通知信，會自動加進來。'; display:block; color:var(--mute); font-size:14px; padding:6px 0; line-height:1.6}

/* 表單（編輯、預設值、通行碼） */
.form{display:grid; gap:12px}
.form label{font-size:14px; color:var(--mute); display:grid; gap:4px}
.form input:not([type=checkbox]){font:inherit; font-size:16px; color:var(--ink); background:var(--bg);
  border:1px solid var(--line); border-radius:10px; height:44px; padding:0 10px; width:100%; min-width:0}
.form .two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.chk{display:flex; align-items:center; gap:8px; font-size:15px; color:var(--ink)}
.chk input[type=checkbox]{width:22px; height:22px; accent-color:var(--brand); margin:0}
.chk input[type=number]{width:72px; text-align:center}
.chk input[type=number]:disabled{opacity:.4}
#editor{width:calc(100% - 32px); max-width:440px; max-height:calc(100% - 32px); border-radius:20px; background:var(--card)}
#editor .sheet{padding:20px}
.form select{font:inherit; font-size:15px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; height:44px; padding:0 8px}
.rm{display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center}
.rm .val{display:flex; align-items:center; gap:6px; min-width:0}
.rm .val input[type=number]{width:72px; text-align:center}
.rm .val span{font-size:14px; color:var(--mute)}
.rm .x{width:40px; height:44px; border:1px solid var(--line); background:none; color:var(--full); border-radius:10px; font-size:18px}
.rm-when{grid-column:1 / -1; font-size:12px; color:var(--mute); margin-top:-4px}
#rm-list{display:grid; gap:10px}
#rm-list:empty::after{content:'沒有提醒（這筆預約不會通知）'; font-size:14px; color:var(--mute)}

/* 全螢幕提醒 */
#alarm{width:100%; max-width:none; height:100%; max-height:none; margin:0; background:var(--brand); color:var(--brand-ink)}
#alarm .wrap{min-height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:14px;
  padding:calc(env(safe-area-inset-top) + 32px) 24px calc(env(safe-area-inset-bottom) + 32px)}
#alarm .ring{font-size:64px; animation:ring 1s ease-in-out infinite}
#alarm h3{font-size:28px; margin:0; line-height:1.3}
#alarm .space{font-size:22px; font-weight:600}
#alarm .time{font-size:56px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1}
#alarm .left{font-size:17px; opacity:.85}
#alarm button{margin-top:24px; width:100%; max-width:320px; min-height:58px; border:0; border-radius:18px; font-size:18px; font-weight:700;
  background:var(--brand-ink); color:var(--brand)}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){ #alarm .ring{animation:none} }
footer{font-size:12px; color:var(--mute); text-align:center; margin-top:18px; line-height:1.6}
@media (prefers-reduced-motion:reduce){ .bar i{transition:none} }
</style>
</head>
<body>
<header>
  <div>
    <h1>清大圖書館座位</h1>
    <div class="sub" id="updated">讀取中…</div>
  </div>
  <div class="hdr-btns">
    <button class="pill" id="bell" type="button" aria-label="通知總覽">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="badge" id="badge" hidden></span>
    </button>
    <button class="pill" id="refresh" type="button">重新整理</button>
  </div>
</header>

<main id="cards"></main>

<h2>目前可預約空間</h2>
<section class="card" id="spaces"><div class="note">讀取中…</div></section>

<div class="actions">
  <a class="btn primary" id="book" href="https://idm.nthu.ust.edu.tw/openid/886UST_NTHU/authorize/?client_id=227897&response_type=code&redirect_uri=https://libsms.lib.nthu.edu.tw/openidcallback.aspx&state=RWD&scope=openid" target="_blank" rel="noopener">登入並預約座位</a>
  <a class="btn ghost" href="https://libsms.lib.nthu.edu.tw/build/" target="_blank" rel="noopener">開啟預約系統首頁</a>
</div>

<h2>預約通知</h2>
<button class="card" id="next-card" type="button">
  <div><b id="next-title">讀取中…</b><div class="note" id="next-sub"></div></div>
  <span class="go" aria-hidden="true">›</span>
</button>

<footer>人數資料來自清大圖書館公開資訊，每分鐘自動更新。<br>預約通知由圖書館的預約確認信自動建立。<br>非官方工具，預約仍在圖書館官方系統完成。</footer>

<!-- 通知總覽 -->
<dialog id="panel">
  <div class="sheet">
    <div class="sheet-head">
      <h2>通知總覽</h2>
      <button class="pill" id="panel-close" type="button">關閉</button>
    </div>

    <section class="card" id="token-box" hidden>
      <form class="form" id="token-form">
        <div><b>輸入通行碼</b><div class="note">就是你在 Render 設定的 TICK_TOKEN。只要輸入一次，會記在這支手機上。</div></div>
        <input id="token-input" type="password" autocomplete="off" placeholder="通行碼" required>
        <button class="btn primary small" type="submit">儲存</button>
      </form>
    </section>

    <section class="card" id="push-box">
      <div class="split">
        <div><b id="push-state">手機推播：未開啟</b><div class="note" id="push-sub">開啟後，提醒時間一到會直接跳在手機上。</div></div>
        <button class="btn ghost small" id="push-btn" type="button">開啟推播</button>
      </div>
    </section>

    <section class="card">
      <div class="split"><b>我的預約通知</b><span class="note" id="sync-status" style="margin:0"></span></div>
      <div id="list"></div>
    </section>

    <section class="card">
      <form class="form" id="defaults-form">
        <div><b>自動加入時的預設提醒</b><div class="note">只套用在之後自動加入的預約；已經加入的可以個別編輯。</div></div>
        <div class="chk"><input id="d-before-on" type="checkbox"><label for="d-before-on">開始前</label>
          <input id="d-before" type="number" min="1" max="720" inputmode="numeric"><span>分鐘</span></div>
        <div class="chk"><input id="d-after-on" type="checkbox"><label for="d-after-on">開始後</label>
          <input id="d-after" type="number" min="1" max="720" inputmode="numeric"><span>分鐘（提醒刷卡）</span></div>
        <button class="btn ghost small" type="submit" id="d-save">儲存預設值</button>
      </form>
    </section>
  </div>
</dialog>

<!-- 編輯單筆通知 -->
<dialog id="editor">
  <form class="sheet form" id="edit-form" method="dialog">
    <b style="font-size:17px">編輯通知</b>
    <label>空間 <input id="e-space" maxlength="60" required></label>
    <div class="two">
      <label>開始日期 <input id="e-sdate" type="date" required></label>
      <label>開始時間 <input id="e-start" type="time" required></label>
    </div>
    <div class="two">
      <label>結束日期 <input id="e-edate" type="date" required></label>
      <label>結束時間 <input id="e-end" type="time" required></label>
    </div>
    <b style="font-size:15px; margin-top:4px">提醒</b>
    <div id="rm-list"></div>
    <button class="btn ghost small" type="button" id="rm-add">＋ 新增提醒</button>
    <div class="note err" id="e-msg"></div>
    <div class="two">
      <button class="btn ghost small" type="button" id="e-cancel">取消</button>
      <button class="btn primary small" type="submit">儲存</button>
    </div>
  </form>
</dialog>

<!-- 全螢幕提醒（點通知進來、或 app 開著時收到提醒） -->
<dialog id="alarm">
  <div class="wrap">
    <div class="ring" aria-hidden="true">🔔</div>
    <h3 id="al-title"></h3>
    <div class="space" id="al-space"></div>
    <div class="time" id="al-time"></div>
    <div class="left" id="al-left"></div>
    <button type="button" id="al-ok">知道了</button>
  </div>
</dialog>

<script>
const SOURCES = [
  { id:'main',  name:'總館在館人數', cap:1365,
    url:'https://libsms.lib.nthu.edu.tw/api/user/M_LibUser/stay', pick:async r=>(await r.json()).count },
  { id:'night', name:'夜讀區', cap:200,
    url:'https://libsms.lib.nthu.edu.tw/API/Nthu24kIn.aspx', pick:async r=>parseInt((await r.text()).trim(),10) },
  { id:'hs',    name:'人社分館在館人數', cap:null,
    url:'https://libsms.lib.nthu.edu.tw/api/user/libuser/stay', pick:async r=>(await r.json()).count },
];

const cards = document.getElementById('cards');
const updated = document.getElementById('updated');
const btn = document.getElementById('refresh');

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(s, v, failed){
  let el = document.getElementById('c-'+s.id);
  if(!el){ el = document.createElement('section'); el.className='card'; el.id='c-'+s.id; cards.appendChild(el); }
  if(failed){
    el.innerHTML = `<div class="row"><span class="name">${esc(s.name)}</span><span class="tag err">讀取失敗</span></div>
      <div class="note">目前無法取得這項資料。</div>`;
    return;
  }
  let used, cap = s.cap, left = null;
  if(v && typeof v === 'object'){ used=v.used; cap=v.cap; left=v.left; } else used = v;
  if(!Number.isFinite(used)){ return render(s, null, true); }
  let tag = '', bar = '', note = '';
  if(cap){
    const pct = Math.min(100, Math.round(used/cap*100));
    const cls = pct>=90 ? 'full' : pct>=70 ? 'warn' : 'ok';
    const word = pct>=90 ? '接近滿' : pct>=70 ? '偏多' : '寬鬆';
    const color = cls==='full' ? 'var(--full)' : cls==='warn' ? 'var(--warn)' : 'var(--ok)';
    tag = `<span class="tag ${cls}">${word} ${pct}%</span>`;
    bar = `<div class="bar"><i style="width:${pct}%;background:${color}"></i></div>`;
    note = `<div class="note">剩餘 ${left ?? Math.max(0, cap-used)}</div>`;
  }
  el.innerHTML = `<div class="row"><span class="name">${esc(s.name)}</span>${tag}</div>
    <div class="num">${used}${cap ? ` <small>/ ${cap}</small>` : ' <small>人</small>'}</div>${bar}${note}`;
}

const spacesEl = document.getElementById('spaces');
async function loadSpaces(){
  try{
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 8000);
    const r = await fetch('https://libsms.lib.nthu.edu.tw/system/status.aspx', { cache:'no-store', signal:ctl.signal });
    clearTimeout(t);
    if(!r.ok) throw new Error(r.status);
    const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
    const rows = [...doc.querySelectorAll('section.status tr')]
      .map(tr=>[...tr.querySelectorAll('td')].map(td=>td.textContent.trim()))
      .filter(c=>c.length>=2 && c[0] && /^\d+$/.test(c[1]));
    if(!rows.length) throw new Error('empty');
    renderSpaces(rows);
    state.spaces = rows;
    return true;
  }catch(e){
    if(!state.spaces) spacesEl.innerHTML = '<div class="note err" style="padding:10px 0">目前無法取得可預約空間資料。</div>';
    return false;
  }
}
function renderSpaces(rows){
  spacesEl.innerHTML = rows.map(([name,n])=>
    `<div class="sp${n==='0'?' zero':''}"><span>${esc(name)}</span><b>${esc(n)}</b></div>`).join('');
}

// 上次成功的資料存在手機裡：開啟時先顯示，連線慢也不會是空白
const LAST_KEY = 'nthu-lib-last';
let state = { t:0, vals:{}, spaces:null };
try{ const s = JSON.parse(localStorage.getItem(LAST_KEY)); if(s && s.vals) state = s; }catch(e){}
const hm = t => new Date(t).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});

let loading = false;
async function load(){
  if(loading) return;
  loading = true; btn.disabled = true;
  updated.classList.remove('err');
  updated.textContent = state.t ? `更新中…（目前顯示 ${hm(state.t)} 的資料）` : '讀取中…';
  let ok = 0, failed = 0;
  const sp = loadSpaces();
  await Promise.all(SOURCES.map(async s=>{
    try{
      const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 12000);
      const r = await fetch(s.url, { cache:'no-store', signal:ctl.signal }); clearTimeout(t);
      if(!r.ok) throw new Error(r.status);
      const v = await s.pick(r);
      render(s, v); state.vals[s.id] = v; ok++;
    }catch(e){
      failed++;
      if(!(s.id in state.vals)) render(s, null, true);   // 有舊資料就保留舊資料
    }
  }));
  if(await sp) ok++; else failed++;
  if(ok){
    if(!failed) state.t = Date.now();
    try{ localStorage.setItem(LAST_KEY, JSON.stringify(state)); }catch(e){}
  }
  if(!failed) updated.textContent = `更新於 ${hm(state.t)}`;
  else if(state.t) updated.textContent = `圖書館伺服器回應慢，部分仍是 ${hm(state.t)} 的資料`;
  else updated.textContent = ok ? '部分資料讀取失敗，可按重新整理再試' : '無法連線，請檢查網路後再試';
  updated.classList.toggle('err', !!failed);
  loading = false; btn.disabled = false;
}

// 依固定順序先放好卡片位置，避免載入時跳動
SOURCES.forEach(s=>{ const el=document.createElement('section'); el.className='card'; el.id='c-'+s.id;
  el.innerHTML=`<div class="row"><span class="name">${esc(s.name)}</span></div><div class="num">–</div>`; cards.appendChild(el);
  if(s.id in state.vals) render(s, state.vals[s.id]); });
if(state.spaces) renderSpaces(state.spaces);

btn.addEventListener('click', load);
setInterval(()=>{ if(!document.hidden) load(); }, 60000);
load();

// =====================================================================
// 預約通知：預約由「圖書館預約確認信 → Apps Script → 後端」自動加入，
// 這裡只負責查看、編輯、刪除，以及推播開關。
// =====================================================================
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
let PUSH_API = 'https://nthu-lib-push.onrender.com';   // 你的 Render 後端（結尾不要加斜線）
try{ PUSH_API = localStorage.getItem('nthu-lib-api') || PUSH_API; }catch(e){}   // 本機測試時可覆寫

const TOKEN_KEY = 'nthu-lib-token', CACHE_KEY = 'nthu-lib-notify', OLD_KEYS = ['nthu-lib-bookings','nthu-lib-remind','nthu-lib-official','nthu-lib-booking-at'];
const lsGet = (k, d) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
try{ OLD_KEYS.forEach(k=>localStorage.removeItem(k)); }catch(e){}   // 清掉舊版手動提醒的資料

let token = lsGet(TOKEN_KEY, '');
let { bookings = [], settings = { before:10, after:5, updatedAt:0 }, syncedAt = 0 } = lsGet(CACHE_KEY, {});
const saveCache = () => lsSet(CACHE_KEY, { bookings, settings, syncedAt });

// ---- 和後端溝通 ----
async function api(path, body){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 60000);   // Render 睡著時要等它醒
  try{
    const r = await fetch(PUSH_API + path, { method: body ? 'POST' : 'GET', signal: ctl.signal,
      headers: { ...(body ? {'Content-Type':'application/json'} : {}), 'X-Token': token || '' },
      body: body ? JSON.stringify(body) : undefined });
    if(r.status === 401){ $('token-box').hidden = false; throw new Error('需要通行碼'); }
    if(!r.ok) throw new Error(`後端回應 ${r.status}`);
    return await r.json();
  }finally{ clearTimeout(t); }
}

// 把這支手機上的編輯送出，同時拿回後端最新的完整清單（Apps Script 新加的也會一起回來）
let syncing = null;
function sync(){
  if(!syncing) syncing = (async ()=>{
    $('sync-status').textContent = '同步中…'; $('sync-status').classList.remove('err');
    try{
      const res = await api('/bookings', { bookings, settings });
      bookings = res.bookings || []; settings = res.settings || settings; syncedAt = Date.now();
      saveCache(); renderAll();
      $('sync-status').textContent = `已同步 ${hm(syncedAt)}`;
    }catch(e){
      $('sync-status').textContent = e.name==='AbortError' ? '後端沒有回應' : (e.message || '同步失敗');
      $('sync-status').classList.add('err');
    }finally{ syncing = null; }
  })();
  return syncing;
}

// ---- 顯示 ----
const WEEK = '日一二三四五六';
const fmtDay = d => `${d.getMonth()+1}/${d.getDate()}（${WEEK[d.getDay()]}）`;
const fmtHM = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const active = () => bookings.filter(b => !b.deleted && new Date(b.end).getTime() > Date.now())
  .sort((a,b) => new Date(a.start) - new Date(b.start));

// 提醒清單：{kind:'before',min} / {kind:'after',min} / {kind:'at',at}（舊格式 before/after 數字也看得懂）
const listOf = b => Array.isArray(b.reminders) ? b.reminders : [
  ...(b.before ? [{ kind:'before', min:b.before }] : []), ...(b.after ? [{ kind:'after', min:b.after }] : [])];
function remindersOf(b){
  const s = new Date(b.start).getTime();
  return listOf(b).map(r =>
    r.kind === 'before' ? { at: s - r.min*60000, label: r.min ? `開始前 ${r.min} 分` : '開始時' } :
    r.kind === 'after'  ? { at: s + r.min*60000, label: `開始後 ${r.min} 分` } :
    { at: new Date(r.at).getTime(), label: `指定 ${fmtDay(new Date(r.at))}` }
  ).filter(r => !isNaN(r.at)).sort((x,y) => x.at - y.at);
}

function renderAll(){
  const list = active();
  const now = Date.now();
  const upcoming = list.flatMap(b => remindersOf(b).filter(r => r.at > now).map(r => ({ ...r, b })))
    .sort((x,y) => x.at - y.at);

  // 鈴鐺上的數字：還沒響的通知數
  $('badge').hidden = !upcoming.length;
  $('badge').textContent = upcoming.length > 9 ? '9+' : upcoming.length;

  // 首頁卡片：下一則通知
  if(upcoming.length){
    const n = upcoming[0], at = new Date(n.at);
    $('next-title').textContent = `下一則：${fmtDay(at)} ${fmtHM(at)}`;
    $('next-sub').textContent = `${n.b.space}・${n.label}　共 ${upcoming.length} 則待通知`;
  }else{
    $('next-title').textContent = '目前沒有待發的通知';
    $('next-sub').textContent = '預約成功後收到圖書館通知信，會自動加進來。';
  }

  // 總覽清單
  $('list').innerHTML = list.map(b=>{
    const s = new Date(b.start), e = new Date(b.end);
    const chips = remindersOf(b).map(r =>
      `<span class="chip${r.at <= now ? ' done' : ''}">${r.label}・${fmtHM(new Date(r.at))}</span>`).join('')
      || '<span class="chip off">不通知</span>';
    return `<div class="nt">
      <div class="t">${esc(b.space)}</div>
      <div class="d">${fmtDay(s)} ${fmtHM(s)}–${fmtHM(e)}${b.source==='mail' ? '・來自預約信' : ''}</div>
      <div class="chips">${chips}</div>
      <div class="nt-btns">
        <button class="btn ghost small" type="button" data-edit="${esc(b.id)}">編輯</button>
        <button class="link-danger" type="button" data-del="${esc(b.id)}">刪除</button>
      </div></div>`;
  }).join('');

  // 預設值表單（正在編輯時不要蓋掉）
  if(!$('defaults-form').contains(document.activeElement)){
    fillToggle('d-before', settings.before, 10);
    fillToggle('d-after', settings.after, 5);
  }
}

// 「開始前 / 開始後」：勾選框 + 分鐘數。0 代表不通知
function fillToggle(prefix, val, fallback){
  $(prefix+'-on').checked = val > 0;
  $(prefix).value = val > 0 ? val : fallback;
  $(prefix).disabled = !(val > 0);
}
function readToggle(prefix){
  if(!$(prefix+'-on').checked) return 0;
  const v = parseInt($(prefix).value, 10);
  return v > 0 && v <= 720 ? v : NaN;
}
['d-before','d-after'].forEach(p =>
  $(p+'-on').addEventListener('change', ()=>{ $(p).disabled = !$(p+'-on').checked; }));

// ---- 總覽面板 ----
function openPanel(){ renderAll(); if(!$('panel').open) $('panel').showModal(); sync(); }
$('bell').addEventListener('click', openPanel);
$('next-card').addEventListener('click', openPanel);
$('panel-close').addEventListener('click', ()=>$('panel').close());

function update(id, patch){
  bookings = bookings.map(b => b.id === id ? { ...b, ...patch, updatedAt: Date.now() } : b);
  saveCache(); renderAll(); sync();
}

$('list').addEventListener('click', e=>{
  const del = e.target.closest('[data-del]'), edit = e.target.closest('[data-edit]');
  if(del){
    const b = bookings.find(x => x.id === del.dataset.del); if(!b) return;
    if(confirm(`刪除「${b.space}」${fmtDay(new Date(b.start))}的通知？\n（只刪通知，不會取消圖書館的預約）`))
      update(b.id, { deleted:true });
  }
  if(edit) openEditor(edit.dataset.edit);
});

// ---- 編輯單筆 ----
let editingId = null;
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const localDT = d => `${ymd(d)}T${fmtHM(d)}`;   // datetime-local 的格式

// 一列提醒：[種類] [分鐘數 或 日期時間] [✕]，下面小字顯示實際會響的時間
function rmRow(r){
  const row = document.createElement('div'); row.className = 'rm';
  row.innerHTML = `<select aria-label="提醒種類">
      <option value="before">開始前</option><option value="after">開始後</option><option value="at">指定時間</option></select>
    <div class="val"></div>
    <button type="button" class="x" aria-label="刪除這則提醒">✕</button>
    <div class="rm-when"></div>`;
  const sel = row.querySelector('select'), val = row.querySelector('.val');
  const draw = (kind, v) => {
    val.innerHTML = kind === 'at'
      ? `<input type="datetime-local" required style="width:100%">`
      : `<input type="number" min="0" max="1440" inputmode="numeric" required><span>分鐘</span>`;
    val.querySelector('input').value = v;
    rmPreview();
  };
  sel.value = r.kind;
  draw(r.kind, r.kind === 'at' ? localDT(new Date(r.at)) : r.min);
  sel.addEventListener('change', ()=>{
    const s = editorStart() || new Date();
    draw(sel.value, sel.value === 'at' ? localDT(new Date(s.getTime() - 3600e3)) : (sel.value === 'before' ? 10 : 5));
  });
  row.querySelector('.x').addEventListener('click', ()=>row.remove());
  return row;
}
function readRow(row){
  const kind = row.querySelector('select').value, input = row.querySelector('.val input');
  if(kind === 'at'){ const d = new Date(input.value); return isNaN(d) ? null : { kind, at: d.toISOString() }; }
  const min = parseInt(input.value, 10);
  return min >= 0 && min <= 1440 && !(kind === 'after' && min === 0) ? { kind, min } : null;
}
const editorStart = () => { const d = new Date(`${$('e-sdate').value}T${$('e-start').value}`); return isNaN(d) ? null : d; };
function rmPreview(){
  const s = editorStart();
  $('rm-list').querySelectorAll('.rm').forEach(row=>{
    const r = readRow(row), out = row.querySelector('.rm-when');
    if(!r){ out.textContent = '請填好分鐘數或日期時間'; return; }
    const at = r.kind === 'at' ? new Date(r.at) : s && new Date(s.getTime() + (r.kind === 'before' ? -1 : 1) * r.min * 60000);
    out.textContent = at ? `→ ${fmtDay(at)} ${fmtHM(at)} 通知${at < new Date() ? '（已經過了）' : ''}` : '';
  });
}
$('edit-form').addEventListener('input', rmPreview);
$('rm-add').addEventListener('click', ()=>{
  if($('rm-list').children.length >= 10) return;
  $('rm-list').appendChild(rmRow({ kind:'before', min:10 })); rmPreview();
});

function openEditor(id){
  const b = bookings.find(x => x.id === id); if(!b) return;
  editingId = id;
  const s = new Date(b.start), e = new Date(b.end);
  $('e-space').value = b.space;
  $('e-sdate').value = ymd(s); $('e-start').value = fmtHM(s);
  $('e-edate').value = ymd(e); $('e-end').value = fmtHM(e);
  $('rm-list').replaceChildren(...listOf(b).map(rmRow));
  rmPreview();
  $('e-msg').textContent = '';
  $('editor').showModal();
}
$('e-cancel').addEventListener('click', ()=>$('editor').close());
$('edit-form').addEventListener('submit', ev=>{
  ev.preventDefault();
  const fail = t => { $('e-msg').textContent = t; };
  const space = $('e-space').value.trim();
  const start = editorStart();
  const end = new Date(`${$('e-edate').value}T${$('e-end').value}`);
  if(!space) return fail('請填空間名稱。');
  if(!start || isNaN(end)) return fail('請填好日期與時間。');
  if(end <= start) return fail('結束時間要比開始晚（跨夜請把結束日期改成隔天）。');
  const reminders = [...$('rm-list').children].map(readRow);
  if(reminders.some(r => !r)) return fail('提醒的分鐘數請填 0～1440（開始後至少 1），或選好日期時間。');
  update(editingId, { space, start:start.toISOString(), end:end.toISOString(), reminders });
  $('editor').close();
});

// ---- 預設值 ----
$('defaults-form').addEventListener('submit', ev=>{
  ev.preventDefault();
  const before = readToggle('d-before'), after = readToggle('d-after');
  if(isNaN(before) || isNaN(after)){ $('d-save').textContent = '分鐘數請填 1～720'; return; }
  settings = { before, after, updatedAt: Date.now() };
  saveCache(); sync().then(()=>{ $('d-save').textContent = '已儲存 ✓'; setTimeout(()=>$('d-save').textContent='儲存預設值', 2000); });
  document.activeElement.blur();
});

// ---- 通行碼 ----
$('token-form').addEventListener('submit', async ev=>{
  ev.preventDefault();
  token = $('token-input').value.trim(); lsSet(TOKEN_KEY, token);
  $('token-box').hidden = true; $('token-input').value = '';
  await registerPush(); await sync();
});

// ---- 推播 ----
let pushSub = null;
function b64ToUint8(s){ const p='='.repeat((4-s.length%4)%4); const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); }

async function refreshPushState(){
  const box=$('push-box'), st=$('push-state'), sub=$('push-sub'), b=$('push-btn');
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    st.textContent='此瀏覽器不支援推播'; sub.textContent='請把 app 加到主畫面後再開啟。'; b.hidden=true; return; }
  const reg = await navigator.serviceWorker.ready;
  pushSub = await reg.pushManager.getSubscription();
  const on = pushSub && Notification.permission==='granted';
  box.classList.toggle('on', !!on);
  st.textContent = on ? '手機推播：已開啟' : '手機推播：未開啟';
  sub.textContent = on ? '通知時間一到會直接跳在手機上。' : '開啟後，通知時間一到會直接跳在手機上。';
  b.textContent = on ? '發送測試' : '開啟推播';
}
// 把訂閱交給後端（每次開 app 都送一次，後端重啟也能補回來）
async function registerPush(){
  if(!pushSub) return;
  try{ await api('/subscribe', { subscription: pushSub }); }catch(e){ console.error('subscribe failed', e); }
}
async function enablePush(){
  const b=$('push-btn'); b.disabled=true;
  try{
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ $('push-sub').textContent='你拒絕了通知權限，請到瀏覽器設定裡允許。'; return; }
    const reg = await navigator.serviceWorker.ready;
    const { key } = await (await fetch(PUSH_API+'/vapid')).json();
    pushSub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToUint8(key) });
    await registerPush();
    await refreshPushState();
  }catch(e){ $('push-sub').textContent='開啟失敗：'+(e.message||e); console.error(e); }
  finally{ b.disabled=false; }
}
$('push-btn').addEventListener('click', async ()=>{
  if(pushSub && Notification.permission==='granted'){
    $('push-sub').textContent='測試推播已送出，稍等幾秒…';
    try{ await api('/test', { subscription: pushSub }); }catch(e){ $('push-sub').textContent='測試失敗：'+e.message; }
  }else enablePush();
});

// ---- 全螢幕提醒 ----
let alarmData = null;
function alarmTick(){
  if(!alarmData || !$('alarm').open) return;
  const s = new Date(alarmData.start), e = new Date(alarmData.end), now = Date.now();
  const m = Math.round((s - now) / 60000);
  $('al-left').textContent =
    now >= e ? '這段預約已經結束' :
    m > 0 ? `還有 ${m >= 60 ? `${Math.floor(m/60)} 小時 ${m%60} 分` : `${m} 分鐘`}開始` :
    m === 0 ? '現在開始，記得刷卡報到' : `已開始 ${-m} 分鐘，還沒刷卡請立刻去報到`;
}
function showAlarm(a){
  if(!a || !a.start) return;
  alarmData = a;
  const s = new Date(a.start);
  $('al-title').textContent = a.title || '圖書館預約提醒';
  $('al-space').textContent = a.space || '';
  $('al-time').textContent = fmtHM(s);
  if(!$('alarm').open) $('alarm').showModal();
  alarmTick();
  try{ navigator.vibrate && navigator.vibrate([400,150,400,150,800]); }catch(e){}
}
$('al-ok').addEventListener('click', ()=>$('alarm').close());
setInterval(alarmTick, 15000);
navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', e=>{
  if(e.data && e.data.type === 'alert') showAlarm(e.data.alert);
});
// 從通知點進來：網址帶著 ?alert=...
try{
  const q = new URLSearchParams(location.search).get('alert');
  if(q){ history.replaceState(null, '', location.pathname); showAlarm(JSON.parse(q)); }
}catch(e){}

// ---- 啟動 ----
renderAll();   // 先用手機裡的快取顯示
setInterval(renderAll, 30000);   // 讓「下一則」和數字跟著時間更新
let lastSync = 0;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  load();
  if(Date.now() - lastSync > 30000){ lastSync = Date.now(); sync(); }
});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
    .then(()=>refreshPushState()).then(registerPush).catch(()=>{})
    .then(()=>{ lastSync = Date.now(); return sync(); });
}else sync();
</script>
